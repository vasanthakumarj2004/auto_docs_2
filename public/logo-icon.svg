<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <defs>
    <linearGradient id="iconPrimaryGrad" x1="12" y1="12" x2="68" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2F3DE0"/>
      <stop offset="100%" stop-color="#19228C"/>
    </linearGradient>
    <linearGradient id="iconTealGrad" x1="20" y1="60" x2="68" y2="20" gradientUnits="userSpaceOnUse">
