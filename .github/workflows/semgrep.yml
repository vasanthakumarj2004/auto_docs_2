
name: Semgrep Security Scan

on:
  push:
    branches:
      - nav-edit_20_11

  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Semgrep scan
        run: semgrep scan --config auto
