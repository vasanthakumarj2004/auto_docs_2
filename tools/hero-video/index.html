<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Docsynecx Hero Ambient Background Video Generator (1920x1080, T=12s)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }
    #viewport-container {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: #ffffff;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      overflow: hidden;
    }
    #render-canvas {
      width: 1920px;
      height: 1080px;
      display: block;
      background: #ffffff;
    }
      width: 100%;
      height: 100%;
      display: block;
      background: #ffffff;
    }
    .controls {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: monospace;
      font-size: 13px;
    }
    button {
      padding: 6px 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
    }
    button:hover { background: #1d4ed8; }
    input[type=range] { width: 320px; cursor: pointer; }
    label { display: flex; items-center: center; gap: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <div id="viewport-container">
    <canvas id="render-canvas" width="1920" height="1080"></canvas>
  </div>

  <div class="controls">
    <button id="btn-play">Pause</button>
    <label>
      Time: <input type="range" id="time-slider" min="0" max="12" step="0.04166666" value="0">
      <span id="time-display">0.00s / 12.00s (frame 0/288)</span>
    </label>
    <label>
      <input type="checkbox" id="chk-zones"> Show Keep-Out Zones
    </label>
  </div>

  <script>
    const canvas = document.getElementById('render-canvas');
    const ctx = canvas.getContext('2d');
    const WIDTH = 1920;
    const HEIGHT = 1080;
    const TOTAL_TIME = 12.0; // 12 seconds loop
    const FPS = 24;
    const TOTAL_FRAMES = 288;

    let isPlaying = true;
    let startTime = performance.now();
    let showKeepOutZones = false;

    // Public variable for Playwright headless screenshot runner
    window.__t = 0;

    // Lane definitions (cubic bezier curves across 1920px)
    // Top lane: spans across top peripheral zone (y ~ 50-70)
    function getTopLanePoint(progress) {
      // progress in [0, 1]
      const p = ((progress % 1) + 1) % 1;
      const x = p * WIDTH;
      // Gentle curve: y dips slightly in middle, then returns
      const y = 62 + Math.sin(p * Math.PI) * 16;
      return { x, y };
    }

    // Bottom lane: spans across bottom peripheral zone (y ~ 1010-1030)
    function getBottomLanePoint(progress) {
      const p = ((progress % 1) + 1) % 1;
      const x = p * WIDTH;
      const y = 1018 - Math.sin(p * Math.PI) * 14;
      return { x, y };
    }

    // Center vertical gutter lane: x ~ 940 (49%), y from 75 to 1000
    function getGutterPoint(progress) {
      const p = ((progress % 1) + 1) % 1;
      const x = 938 + Math.sin(p * Math.PI * 2) * 12;
      const y = 80 + p * (1000 - 80);
      return { x, y };
    }

    // Keep-Out Zones:
    // Left text column: x in [0.06 * 1920, 0.47 * 1920] = [115, 902], y in [0.12 * 1080, 0.88 * 1080] = [130, 950]
    // Right panel: x in [0.50 * 1920, 0.95 * 1920] = [960, 1824], y in [0.10 * 1080, 0.90 * 1080] = [108, 972]
    function getKeepOutAlphaMultiplier(x, y) {
      const leftCol = { x1: 115, x2: 902, y1: 130, y2: 950 };
      const rightCol = { x1: 960, x2: 1824, y1: 108, y2: 972 };

      // Helper to calculate smooth 0-to-1 fade buffer around rectangle
      function distInside(box, px, py, padding = 40) {
        if (px >= box.x1 - padding && px <= box.x2 + padding &&
            py >= box.y1 - padding && py <= box.y2 + padding) {
          // Inside or near boundary
          const dx = Math.max(0, Math.min(px - box.x1, box.x2 - px));
          const dy = Math.max(0, Math.min(py - box.y1, box.y2 - py));
          if (px >= box.x1 && px <= box.x2 && py >= box.y1 && py <= box.y2) {
            return 0.0; // Strictly inside keepout
          }
          // Border falloff
          const dBorder = Math.min(
            Math.abs(px - box.x1), Math.abs(px - box.x2),
            Math.abs(py - box.y1), Math.abs(py - box.y2)
          );
          return Math.min(1.0, dBorder / padding);
        }
        return 1.0;
      }

      const m1 = distInside(leftCol, x, y, 40);
      const m2 = distInside(rightCol, x, y, 40);
      return Math.min(m1, m2);
    }

    // Draw document card
    // type: 0 = Tax Invoice (table), 1 = Bill of Lading (2-col + teal), 2 = Voucher (ledger lines)
    function drawDocumentCard(ctx, cx, cy, type, alpha) {
      if (alpha <= 0.005) return;

      const w = 64;
      const h = 83; // 1:1.3 ratio
      const r = 6;
      const x = cx - w / 2;
      const y = cy - h / 2;

      ctx.save();
      ctx.globalAlpha = alpha;

      // 1. Card Body (White 55%)
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.70)';
      ctx.fill();

      // 1px Navy Stroke (10% alpha)
      ctx.lineWidth = 1;
      ctx.strokeStyle = type === 1 
        ? 'rgba(15, 138, 106, 0.16)' // Teal tint for Bill of Lading
        : 'rgba(11, 19, 48, 0.10)';  // Navy for Invoice & Voucher
      ctx.stroke();

      // 2. Header Bar
      ctx.beginPath();
      ctx.roundRect(x + 5, y + 6, w - 10, 8, 2);
      ctx.fillStyle = type === 1 
        ? 'rgba(204, 251, 241, 0.65)' // Soft mint/teal
        : 'rgba(224, 231, 255, 0.60)'; // Blue-100
      ctx.fill();

      // Small header dot/icon abstract
      ctx.beginPath();
      ctx.arc(x + 9, y + 10, 1.5, 0, Math.PI * 2);
      ctx.fillStyle = type === 1 ? 'rgba(15, 138, 106, 0.40)' : 'rgba(37, 99, 235, 0.35)';
      ctx.fill();

      // 3. Body lines (Abstract bars)
      if (type === 0) {
        // Tax Invoice: 3 table rows + total box
        for (let i = 0; i < 3; i++) {
          const rowY = y + 20 + i * 11;
          ctx.fillStyle = 'rgba(11, 19, 48, 0.07)';
          ctx.fillRect(x + 6, rowY, w - 24, 3);
          ctx.fillStyle = 'rgba(11, 19, 48, 0.10)';
          ctx.fillRect(x + w - 15, rowY, 9, 3);
        }
        // Total box
        ctx.strokeStyle = 'rgba(37, 99, 235, 0.14)';
        ctx.strokeRect(x + 6, y + 58, w - 12, 14);
        ctx.fillStyle = 'rgba(37, 99, 235, 0.12)';
        ctx.fillRect(x + w - 22, y + 62, 13, 5);

      } else if (type === 1) {
        // Bill of Lading: 2 columns + container mark + seal box
        ctx.fillStyle = 'rgba(15, 138, 106, 0.08)';
        ctx.fillRect(x + 6, y + 20, 22, 18);
        ctx.fillRect(x + 32, y + 20, 26, 18);

        ctx.fillStyle = 'rgba(11, 19, 48, 0.07)';
        ctx.fillRect(x + 6, y + 43, w - 12, 3);
        ctx.fillRect(x + 6, y + 50, w - 20, 3);

        // Seal / stamp badge
        ctx.beginPath();
        ctx.roundRect(x + 6, y + 58, 20, 14, 2);
        ctx.fillStyle = 'rgba(15, 138, 106, 0.12)';
        ctx.fill();
        ctx.fillStyle = 'rgba(11, 19, 48, 0.09)';
        ctx.fillRect(x + 30, y + 63, 27, 4);

      } else {
        // Voucher: Ledger lines + account stamp
        for (let i = 0; i < 4; i++) {
          const lineY = y + 20 + i * 9;
          ctx.fillStyle = 'rgba(11, 19, 48, 0.07)';
          ctx.fillRect(x + 6, lineY, (i % 2 === 0 ? w - 16 : w - 24), 2.5);
        }
        // Verified Stamp box
        ctx.beginPath();
        ctx.roundRect(x + w - 26, y + 58, 20, 14, 2);
        ctx.strokeStyle = 'rgba(16, 185, 129, 0.20)';
        ctx.stroke();
        ctx.fillStyle = 'rgba(16, 185, 129, 0.14)';
        ctx.fillRect(x + w - 23, y + 63, 14, 4);
      }

      ctx.restore();
    }

    // Main render function: pure function of time t in [0, TOTAL_TIME)
    window.renderFrame = function(t) {
      // 1. Clear with Pure White (#FFFFFF)
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // 2. Faint Dot Grid (24px spacing, 1px radius, navy 4% alpha)
      // Drifting seamlessly 24px over TOTAL_TIME
      const gridSpacing = 24;
      const driftPhase = (t / TOTAL_TIME) % 1;
      const driftX = driftPhase * gridSpacing;
      const driftY = driftPhase * gridSpacing;

      ctx.save();
      ctx.fillStyle = 'rgba(11, 19, 48, 0.04)';
      for (let x = -gridSpacing + driftX; x < WIDTH + gridSpacing; x += gridSpacing) {
        for (let y = -gridSpacing + driftY; y < HEIGHT + gridSpacing; y += gridSpacing) {
          ctx.beginPath();
          ctx.arc(x, y, 1.0, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();

      // 3. Draw Thin Flow Lanes (1px, navy 6% alpha)
      ctx.save();
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(11, 19, 48, 0.06)';

      // Top lane curve
      ctx.beginPath();
      for (let i = 0; i <= 60; i++) {
        const pt = getTopLanePoint(i / 60);
        if (i === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();

      // Bottom lane curve
      ctx.beginPath();
      for (let i = 0; i <= 60; i++) {
        const pt = getBottomLanePoint(i / 60);
        if (i === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();

      // Center gutter vertical lane
      ctx.beginPath();
      for (let i = 0; i <= 40; i++) {
        const pt = getGutterPoint(i / 40);
        if (i === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();
      ctx.restore();

      // 4. Ledger Nodes (3 small rounded 20px squares near right edge at x = 1860)
      const ledgerNodes = [
        { x: 1860, y: 62 },
        { x: 1860, y: 540 },
        { x: 1860, y: 1018 }
      ];

      ledgerNodes.forEach((node, nodeIdx) => {
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(node.x - 10, node.y - 10, 20, 20, 4);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(11, 19, 48, 0.12)';
        ctx.stroke();

        // Node center dot
        ctx.beginPath();
        ctx.arc(node.x, node.y, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(11, 19, 48, 0.15)';
        ctx.fill();

        // Arrival pulse calculation (every T/3 seconds when a document arrives)
        for (let docIdx = 0; docIdx < 3; docIdx++) {
          const arrivalTime = (docIdx * (TOTAL_TIME / 3) + (nodeIdx === 1 ? 2.0 : 0)) % TOTAL_TIME;
          const dt = (t - arrivalTime + TOTAL_TIME) % TOTAL_TIME;
          if (dt < 0.6) {
            // 600ms pulse: 300ms fade in, 300ms fade out
            const pulsePhase = dt < 0.3 ? dt / 0.3 : (0.6 - dt) / 0.3;
            ctx.beginPath();
            ctx.arc(node.x, node.y, 14 * pulsePhase, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(16, 185, 129, ${0.18 * pulsePhase})`;
            ctx.fill();

            // Soft checkmark glow
            ctx.beginPath();
            ctx.arc(node.x, node.y, 3, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(16, 185, 129, ${0.6 * pulsePhase})`;
            ctx.fill();
          }
        }
        ctx.restore();
      });

      // 5. Data Pulse (Traveling radial glow along top lane once per 6 seconds)
      const pulsePeriod = 6.0;
      const pulseT = (t % pulsePeriod) / pulsePeriod;
      const pulsePt = getTopLanePoint(pulseT);
      const pulseKeepOut = getKeepOutAlphaMultiplier(pulsePt.x, pulsePt.y);

      if (pulseKeepOut > 0.05) {
        ctx.save();
        const glowRad = 80;
        const grad = ctx.createRadialGradient(pulsePt.x, pulsePt.y, 0, pulsePt.x, pulsePt.y, glowRad);
        grad.addColorStop(0, `rgba(47, 61, 224, ${0.12 * pulseKeepOut})`);
        grad.addColorStop(0.5, `rgba(47, 61, 224, ${0.05 * pulseKeepOut})`);
        grad.addColorStop(1, 'rgba(47, 61, 224, 0)');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(pulsePt.x, pulsePt.y, glowRad, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 6. Documents along Top Lane (3 documents, spaced T/3 apart)
      for (let i = 0; i < 3; i++) {
        const offset = i / 3;
        const progress = ((t / TOTAL_TIME) + offset) % 1;
        const pt = getTopLanePoint(progress);

        // Edge fade in (first 8%) and fade out (last 8%)
        let edgeAlpha = 1.0;
        if (progress < 0.08) {
          edgeAlpha = progress / 0.08;
        } else if (progress > 0.92) {
          edgeAlpha = (1.0 - progress) / 0.08;
        }

        const keepOutAlpha = getKeepOutAlphaMultiplier(pt.x, pt.y);
        const finalAlpha = edgeAlpha * keepOutAlpha;

        drawDocumentCard(ctx, pt.x, pt.y, i % 3, finalAlpha);
      }

      // 7. Documents along Bottom Lane (3 documents, spaced T/3 apart, offset by T/6)
      for (let i = 0; i < 3; i++) {
        const offset = (i / 3) + (1 / 6);
        const progress = ((t / TOTAL_TIME) + offset) % 1;
        const pt = getBottomLanePoint(progress);

        let edgeAlpha = 1.0;
        if (progress < 0.08) {
          edgeAlpha = progress / 0.08;
        } else if (progress > 0.92) {
          edgeAlpha = (1.0 - progress) / 0.08;
        }

        const keepOutAlpha = getKeepOutAlphaMultiplier(pt.x, pt.y);
        const finalAlpha = edgeAlpha * keepOutAlpha;

        // Shift types so top & bottom are varied
        drawDocumentCard(ctx, pt.x, pt.y, (i + 1) % 3, finalAlpha);
      }

      // 8. One Document along Center Gutter (period 12s, single gentle drift)
      const gutterProgress = (t / TOTAL_TIME) % 1;
      const gutterPt = getGutterPoint(gutterProgress);
      let gutterEdgeAlpha = 1.0;
      if (gutterProgress < 0.1) gutterEdgeAlpha = gutterProgress / 0.1;
      else if (gutterProgress > 0.9) gutterEdgeAlpha = (1.0 - gutterProgress) / 0.1;
      const gutterKeepOut = getKeepOutAlphaMultiplier(gutterPt.x, gutterPt.y);
      drawDocumentCard(ctx, gutterPt.x, gutterPt.y, 2, gutterEdgeAlpha * gutterKeepOut * 0.85);

      // 9. Optional Debug Keep-Out Overlay
      if (showKeepOutZones) {
        ctx.save();
        ctx.fillStyle = 'rgba(239, 68, 68, 0.12)';
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.50)';
        ctx.lineWidth = 2;

        // Left Col Keep-out
        ctx.fillRect(115, 130, 902 - 115, 950 - 130);
        ctx.strokeRect(115, 130, 902 - 115, 950 - 130);

        // Right Col Keep-out
        ctx.fillStyle = 'rgba(59, 130, 246, 0.12)';
        ctx.strokeStyle = 'rgba(59, 130, 246, 0.50)';
        ctx.fillRect(960, 108, 1824 - 960, 972 - 108);
        ctx.strokeRect(960, 108, 1824 - 960, 972 - 108);

        ctx.font = '16px monospace';
        ctx.fillStyle = '#ef4444';
        ctx.fillText('KEEP-OUT: Left Text Column (max alpha <= 2%)', 130, 160);
        ctx.fillStyle = '#3b82f6';
        ctx.fillText('KEEP-OUT: Right Product Panel (max alpha <= 2%)', 980, 140);
        ctx.restore();
      }
    };

    // Animation Loop for live developer preview
    function animate(now) {
      if (isPlaying) {
        const elapsed = (now - startTime) / 1000;
        window.__t = elapsed % TOTAL_TIME;
        window.renderFrame(window.__t);

        // Update UI
        document.getElementById('time-slider').value = window.__t;
        const frame = Math.floor(window.__t * FPS);
        document.getElementById('time-display').innerText = 
          `${window.__t.toFixed(2)}s / ${TOTAL_TIME.toFixed(2)}s (frame ${frame}/${TOTAL_FRAMES})`;
      }
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // Controls listeners
    document.getElementById('btn-play').addEventListener('click', (e) => {
      isPlaying = !isPlaying;
      e.target.innerText = isPlaying ? 'Pause' : 'Play';
      if (isPlaying) startTime = performance.now() - (window.__t * 1000);
    });

    document.getElementById('time-slider').addEventListener('input', (e) => {
      isPlaying = false;
      document.getElementById('btn-play').innerText = 'Play';
      window.__t = parseFloat(e.target.value);
      window.renderFrame(window.__t);
      const frame = Math.floor(window.__t * FPS);
      document.getElementById('time-display').innerText = 
        `${window.__t.toFixed(2)}s / ${TOTAL_TIME.toFixed(2)}s (frame ${frame}/${TOTAL_FRAMES})`;
    });

    document.getElementById('chk-zones').addEventListener('change', (e) => {
      showKeepOutZones = e.target.checked;
      window.renderFrame(window.__t);
    });
  </script>
</body>
</html>
